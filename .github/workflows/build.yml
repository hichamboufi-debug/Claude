name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  dropshipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dropshipping-fr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  activites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activites-pe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: idees-activites-debug-apk
          path: activites-pe/app/build/outputs/apk/debug/app-debug.apk
